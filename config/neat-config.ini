[NEAT]
fitness_criterion     = max
fitness_threshold     = 8000
# Large enough that steady-state culling cannot reach zero inside a 5-minute
# living-world run. Founders are replaced only by births, which are rare.
pop_size              = 400
reset_on_extinction   = True
no_fitness_termination = False

[DefaultGenome]
# Node activation options
activation_default      = tanh
activation_mutate_rate  = 0.3
activation_options      = tanh sigmoid relu

# Node aggregation options
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# Node bias options
# Positive mean saturates the rest output above 0.5, so founders conserve the
# starting energy budget instead of random-walking into starvation.
bias_init_mean          = 1.2
bias_init_stdev         = 0.15
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.12
bias_mutate_rate        = 0.25
bias_replace_rate       = 0.05

# Genome compatibility options
compatibility_disjoint_coefficient = 1.2
compatibility_weight_coefficient   = 0.5

# Connection gene options
# Favor topology growth over pruning (old delete rates shrank networks ~70% in 50 mutations).
conn_add_prob           = 0.32
conn_delete_prob        = 0.04
enabled_default         = True
# Lower rate: random disables were crippling full_direct starters with 264 connections.
enabled_mutate_rate     = 0.05

# Connection weight options
weight_init_mean        = 0.0
# Modest stdev: new links should nudge behavior, not saturate tanh into a random walk.
weight_init_stdev       = 0.20
weight_max_value        = 30
weight_min_value        = -30
weight_mutate_power     = 0.25
weight_mutate_rate      = 0.7
weight_replace_rate     = 0.05

# Node gene options
node_add_prob           = 0.28
node_delete_prob        = 0.03

# Network structure
num_inputs              = 31
# No initial hidden layer. Body size/metabolism scale with connection count,
# and a dense start burned starting energy before anyone could reach food.
num_hidden              = 0
num_outputs            = 4
feed_forward            = True

# Node response options
response_init_mean      = 1.0
response_init_stdev     = 0.1
response_mutate_rate    = 0.05
response_replace_rate   = 0.02
response_mutate_power   = 0.1
response_max_value      = 30.0
response_min_value      = -30.0

# Additional parameters
# No initial links. Connection count sets body size and metabolism; a dense
# start starved the founders. Offspring still gain links via conn_add_prob.
initial_connection      = unconnected
# Re-add links when a structural mutation would otherwise disconnect the network.
structural_mutation_surer = true

[DefaultSpeciesSet]
# Unconnected founders differ only by bias, so they share one species and can breed.
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 25
species_elitism      = 2

[DefaultReproduction]
# elitism=1 keeps reproduction valid if species later split after divergence.
elitism            = 1
# Slightly more parents contribute offspring each generation.
survival_threshold = 0.25
min_species_size   = 1
